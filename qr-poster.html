<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Meaty Bliss';src:url("assets/MeatyBliss.woff2") format("woff2");font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1240px;height:1754px;overflow:hidden;font-family:'Karla',sans-serif;background:#F5EBD8;position:relative}
  .frame{position:absolute;inset:36px;border:6px solid #281414;display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 60px 0;background:#F5EBD8}
  .mascot{width:300px}
  h1{font-family:'Meaty Bliss',sans-serif;font-size:110px;line-height:.98;text-transform:uppercase;color:#281414;margin-top:10px}
  h1 .chili{color:#F2701D}
  .hand{font-family:'Caveat',cursive;font-weight:600;font-size:44px;white-space:nowrap;color:#A64809;transform:rotate(-2deg);display:inline-block;margin:18px 0 40px}
  .qr-wrap{background:#fff;border:6px solid #281414;box-shadow:16px 16px 0 #F68C1C;padding:34px}
  .qr-wrap img{width:460px;display:block}
  .scan{font-family:'Meaty Bliss',sans-serif;font-size:44px;letter-spacing:.08em;text-transform:uppercase;margin-top:44px;color:#281414}
  .scan .gold{color:#8A4A1E}
  .meta{margin-top:26px;font-size:30px;font-weight:700;color:#543C34}
  .strip{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,#F2701D,#FCA91B);border-top:6px solid #281414;padding:28px;display:flex;justify-content:center;gap:60px;align-items:center}
  .strip span{font-family:'Meaty Bliss',sans-serif;font-size:34px;letter-spacing:.1em;text-transform:uppercase;color:#281414}
  .strip .gold{color:#281414}
</style>
</head>
<body>
  <div class="frame">
    <img class="mascot" src="assets/logo-mark.webp" alt="Berempah Bros mascot">
    <h1>Spice. Crunch.<br><span class="chili">Shiok.</span></h1>
    <span class="hand">Beauty World · Bukit Canberra · Sengkang · Woodleigh · Bedok</span>
    <div class="qr-wrap"><img src="assets/qr-site.png" alt="QR code to the Berempah Bros website"></div>
    <p class="scan">Scan for menu, stalls<br><span class="gold">&amp; islandwide delivery</span></p>
    <p class="meta">5 stalls · MasterChef SG winner Derek Cheong<br>@berempahbros · #SpiceCrunchShiok</p>
  </div>
  <div class="strip">
    <span>Ayam Goreng</span><span class="gold">✦</span><span>Berempah</span>
  </div>
</body>
</html>
