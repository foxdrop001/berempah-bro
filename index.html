<title>Berempah Bros has moved</title>
<link rel="canonical" href="https://www.berempahbros.com/">
<meta http-equiv="refresh" content="1;url=https://www.berempahbros.com/">
<script>
  // This old address moved to www.berempahbros.com. Send people to the same page there.
  (function () {
    var p = location.pathname.replace(/^\/berempah-bro/, '') || '/';
    p = p.replace(/\/index\.html$/, '/').replace(/^\/(story|menu|locations|careers|contact|news)\.html$/, '/$1/');
    if (/^\/admin(\/|$)/.test(p)) p = '/';
    location.replace('https://www.berempahbros.com' + p + location.search + location.hash);
  })();
</script>
