<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Meaty Bliss';src:url("assets/MeatyBliss.woff2") format("woff2");font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:'Karla',sans-serif;position:relative;background:#281414}
  .bg{position:absolute;inset:0;background:linear-gradient(160deg,#F2701D,#FCA91B)}
  .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 82% 45%,rgba(255,255,255,.18),transparent 60%)}
  .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 70px 80px;color:#FFFFFF}
  .mascot{width:190px;margin-bottom:6px;margin-left:-10px}
  h1{font-family:'Meaty Bliss',sans-serif;font-size:96px;line-height:.98;text-transform:uppercase;letter-spacing:.01em;text-shadow:4px 4px 0 rgba(122,36,21,.55)}
  h1 .gold{color:#281414}
  .sub{font-size:30px;font-weight:700;margin-top:22px;max-width:560px;color:#3A2418}
  .hand{font-family:'Caveat',cursive;font-weight:600;font-size:34px;white-space:nowrap;color:#7C2415;transform:rotate(-2deg);display:inline-block;margin-top:18px}
  .strip{position:absolute;left:0;right:0;bottom:0;background:#281414;border-top:3px solid #281414;padding:16px 70px;display:flex;justify-content:space-between;align-items:center;z-index:3}
  .strip span{font-family:'Meaty Bliss',sans-serif;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#F5EBD8}
  .strip .gold{color:#DC6E3C}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="inner">
    <img class="mascot" src="assets/logo-mark.webp" alt="">
    <h1>Spice. Crunch.<br><span class="gold">Shiok.</span></h1>
    <p class="sub">16-spice ayam goreng berempah by MasterChef Singapore winner Derek Cheong</p>
    <span class="hand">Beauty World · Bukit Canberra · Sengkang · Woodleigh · Bedok</span>
  </div>
  <div class="strip">
    <span>5 stalls islandwide</span>
    <span class="gold">#SpiceCrunchShiok</span>
    <span>@berempahbros</span>
  </div>
</body>
</html>
