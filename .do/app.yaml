# DigitalOcean App Platform spec for the Berempah Bros site.
# Static site built from this repo; App Platform rebuilds and deploys on every
# push to main (including dashboard saves), so no separate CI is needed there.
# Docs: docs/migrate-digitalocean.md
name: berempah-bros
region: sgp
static_sites:
  - name: site
    source_dir: /
    output_dir: /
    build_command: node build.mjs
    environment_slug: node-js
    index_document: index.html
    error_document: 404.html
    github:
      repo: effortxd/berempah-bro
      branch: main
      deploy_on_push: true
# When the custom domain is ready, uncomment and set it, then point DNS at
# the app (CNAME) as the App Platform UI instructs:
# domains:
#   - domain: berempahbros.sg
#     type: PRIMARY
