<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F68C1C">
<title>Offline — Berempah Bros</title>
<style>
  body{margin:0;font-family:'Karla',system-ui,sans-serif;background:#F5EBD8;color:#281414;display:grid;min-height:100vh;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  .box{max-width:26rem}
  h1{font-size:2.6rem;margin:0 0 8px;text-transform:uppercase;line-height:1.05}
  h1 em{font-style:normal;color:#A64809}
  p{color:#543C34;line-height:1.5;margin:0 0 20px}
  button{font:inherit;font-weight:700;background:#F2701D;color:#281414;border:2px solid #281414;border-radius:4px;padding:12px 22px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <h1>No signal, <em>bro</em></h1>
  <p>You're offline right now. Pages you've opened before still work, everything else comes back once you're connected.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
